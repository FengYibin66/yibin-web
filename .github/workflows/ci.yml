# 质量门禁（ADR 20260822120807）。
#
# 改造前本仓库唯一的 workflow 是 deploy.yml，它 push main 即自动上生产，
# 且全文一次 test / lint 都没跑——而仓库里有 50+ 个测试从未在 CI 执行过。
#
# 本 workflow 只回答「能不能上」。「要不要上」由人在 deploy.yml 手动触发时回答。
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main # main 的门禁在 PR 阶段已跑过，避免重复计费

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # path-based 过滤：偿还 ADR 20260822120801 的全量构建代价，
  # 改一行简历文案不该重建 portal 和 auto-wechat。
  changes:
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.filter.outputs.portal }}
      resume: ${{ steps.filter.outputs.resume }}
      wechat: ${{ steps.filter.outputs.wechat }}
      wechat_go: ${{ steps.filter.outputs.wechat_go }}
      docs: ${{ steps.filter.outputs.docs }}
      hooks: ${{ steps.filter.outputs.hooks }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # 影响全部应用构建的共享配置。任一改动都要重跑所有 app——
            # 否则「改坏 Dockerfile / 根 workspace 配置」会让全部 job 跳过、
            # gate 判「全 skipped = 通过」而绿灯，构建产物从没被验证过。
            shared: &shared
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'config/**'
              - '.nvmrc'
            portal:
              - 'apps/portal/**'
              - *shared
            resume:
              - 'apps/resume/**'
              - *shared
            wechat:
              - 'apps/auto-wechat/frontend/**'
              - *shared
            wechat_go:
              - 'apps/auto-wechat/backend/**'
              - *shared
            docs:
              - 'docs/adr/**'
              - 'scripts/docs/**'
            hooks:
              - '.claude/hooks/**'
            ci_scripts:
              - 'scripts/ci/**'
            workflows:
              - '.github/workflows/**'

  # Secret 扫描。**刻意不做 path 过滤**：secret 可能出现在任何文件，
  # 按路径跳过等于给自己留门。这也是唯一一个无条件跑的检查。
  #
  # 加它的直接原因：`.claude/hooks/pre-secret-scan.sh` 与 hooks/AGENTS.md 都写着
  # 「CI 的 secret 扫描才是最终防线」，而在此之前**那个扫描根本不存在**——
  # 全仓 grep gitleaks/trufflehog 命中为 0。声称两层防御、实际零层，
  # 比明说「只有一层」更危险，因为读文档的人会以为有网。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 要扫历史，浅克隆会漏
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ADR 索引表是生成物，校验它与实际 ADR 同步（见 scripts/AGENTS.md「生成物纪律」）
  docs-index:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先跑生成器自己的单测，再校验同步。顺序有意：生成器坏了的话
      # `--check` 的结论不可信，先证明工具本身正确。
      - run: python3 scripts/docs/test_gen_docs_index.py
      - run: python3 scripts/docs/gen_docs_index.py --check

  # 门禁脚本是生产代码：静默失效时没有症状，只有下一次事故。
  # 改 hooks 或改门禁汇总逻辑都要跑对应回归测试。
  hooks-test:
    needs: changes
    if: >-
      needs.changes.outputs.hooks == 'true' ||
      needs.changes.outputs.ci_scripts == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hooks 回归测试
        if: needs.changes.outputs.hooks == 'true'
        run: bash .claude/hooks/tests/test-hooks.sh
      - name: 门禁汇总逻辑回归测试
        if: needs.changes.outputs.ci_scripts == 'true'
        run: bash scripts/ci/gate-test.sh
      # workflow 的**接线**检查（区别于上面那条测脚本逻辑的）。
      # 加它的直接原因：gate job 曾把逻辑抽成脚本却漏了 checkout，
      # CI 上 exit 127。脚本测试测不到接线，这一层补的正是那个缺口。
      - name: workflow 接线自测
        if: needs.changes.outputs.ci_scripts == 'true'
        run: python3 scripts/ci/lint-workflows.py --self-test
      - name: workflow 接线检查
        if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.ci_scripts == 'true'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/ci/lint-workflows.py

  resume:
    needs: changes
    if: needs.changes.outputs.resume == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 纹理预载表是生成物（ADR 20260903140615）：从房间注册表 + 走廊布局派生。
      # 手写它的后果不报错——只会"漏一张贴图"或"为死代码预载"，与 ADR 索引
      # 同一套纪律（见 scripts/docs/gen_docs_index.py --check）。
      - name: 校验纹理预载表与声明同步
        working-directory: apps/resume
        run: node scripts/lab/gen-asset-manifest.mjs --check
      # media-src/ 下的原始素材 → public/ 的产物，同样是"改了源忘了重跑"会
      # 静默上线旧文件的一类。三个都只读不写（--check）。
      - name: 校验音频重编码产物
        working-directory: apps/resume
        run: node scripts/media/encode-audio.mjs --check
      - name: 校验 Gallery 门贴图
        working-directory: apps/resume
        run: node scripts/media/gallery-door.mjs --check
      - name: 校验入口页纹理
        working-directory: apps/resume
        run: node scripts/media/optimize-textures.mjs --check
      # 字体子集按仓库里实际出现过的字符裁剪：改了中文文案忘了重跑，
      # 新字会静默落到兜底字体（一句话里蹦出一个不同字形的字）。
      - name: 校验字体子集
        working-directory: apps/resume
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 scripts/media/subset-fonts.py --check
      - run: pnpm --filter @yibin/resume type-check
      - run: pnpm --filter @yibin/resume test
      # 刻意不跑 `pnpm --filter @yibin/resume lint`：eslint.config.mjs 按 flat config 写，
      # 但装的 eslint-config-next@15.5.20 导出的是旧版 eslintrc 对象 → `nextVitals is not iterable`。
      # 这是依赖版本不匹配，修它是一次独立的升级决策（见根 CLAUDE.md「已知负债」），
      # 不是本门禁该顺手带的。跑一个已知必然失败的步骤只会训练人忽略红灯。

  portal:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # server 的类型检查覆盖 __tests__，含 derivedTypes.test-d.ts——
      # 那个文件靠 @ts-expect-error 双向断言派生类型没退化成 any（ADR 20260822120808）。
      - run: pnpm --filter @yibin/portal-server type-check
      - run: pnpm --filter @yibin/portal-server test
      - run: pnpm --filter @yibin/portal-client test
      # client 侧构建即类型检查（`tsc -b && vite build`）
      - run: pnpm --filter @yibin/portal build
      #
      # 刻意不跑 `pnpm --filter @yibin/portal-client lint`：那个 script 声明了 `eslint src`，
      # 但 portal 既没有 eslint 依赖也没有 eslint 配置文件——执行必然 command not found。
      # 跑一个已知必然失败的步骤会让每个 portal PR 都红，等于让人习惯忽略红灯。
      # 这条已登记为负债（见根 CLAUDE.md「已知负债」）；要补 lint 先补依赖与配置。
      #
      # 暂不设覆盖率闸门：server 刚有第一批测试（46 个），client 仍为 0。
      # 先让门禁跑起来，闸门等有稳定基线再设（ADR 20260822120807）。

  # E2E 独立成 job：要装浏览器（~100MB）且必须先构建静态产物，
  # 与单测的运行代价差一个量级，混在一个 job 里会让快反馈也变慢。
  resume-e2e:
    needs: changes
    if: needs.changes.outputs.resume == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 只装用到的两个引擎，别用 `playwright install`（会拉全部三个）
      - name: 装浏览器
        run: pnpm --filter @yibin/resume exec playwright install --with-deps chromium webkit

      # E2E 打在静态产物上（见 playwright.config.ts 的说明），必须先 build
      - name: 构建静态产物
        run: pnpm --filter @yibin/resume build

      - name: 跑 E2E
        run: pnpm --filter @yibin/resume test:e2e

      - name: 上传失败时的 trace 与截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/resume/test-results/
            apps/resume/playwright-report/
          retention-days: 7

  wechat-frontend:
    needs: changes
    if: needs.changes.outputs.wechat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wechat-ai-frontend typecheck

  wechat-backend:
    needs: changes
    if: needs.changes.outputs.wechat_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 必须 ≥1.24：internal/infrastructure/rss/collector_test.go 用了
          # testing.Context（1.24 引入）。用 1.23 会直接编译失败。
          # go.mod 原先声明 go 1.22.0 与此不符，已同步改为 1.24。
          go-version: '1.24'
          cache-dependency-path: apps/auto-wechat/backend/go.sum
      - name: go vet
        working-directory: apps/auto-wechat/backend
        run: go vet ./...
      - name: go test
        working-directory: apps/auto-wechat/backend
        run: go test ./...

  # 汇总门：required check 指向这一个 job，各语言 job 按 path 跳过时也能通过。
  # skipped 与 success 都算过，failure / cancelled 不算。
  gate:
    needs: [changes, secret-scan, docs-index, hooks-test, resume, resume-e2e, portal, wechat-frontend, wechat-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 必需：Evaluate 跑的是仓库里的脚本，没有 checkout 就是 exit 127
      # （"No such file or directory"）。这一步曾被漏掉——逻辑内联在 YAML 里时
      # 不需要 checkout，抽成脚本文件后才需要，抽的时候没补上。
      # 由 scripts/ci/lint-workflows.py 门禁化，防复发。
      - uses: actions/checkout@v4
      - name: Evaluate
        # 逻辑抽到脚本里，本地可测（scripts/ci/gate-test.sh）。
        # 刻意不用关联数组：macOS 自带 bash 3.2 不支持，本地就无法验证门禁逻辑，
        # 而无法本地验证的门禁在静默失效时没有症状。
        run: |
          bash scripts/ci/evaluate-gate.sh \
            "changes:${{ needs.changes.result }}" \
            "secret-scan:${{ needs.secret-scan.result }}" \
            "docs-index:${{ needs.docs-index.result }}" \
            "hooks-test:${{ needs.hooks-test.result }}" \
            "resume:${{ needs.resume.result }}" \
            "resume-e2e:${{ needs.resume-e2e.result }}" \
            "portal:${{ needs.portal.result }}" \
            "wechat-frontend:${{ needs.wechat-frontend.result }}" \
            "wechat-backend:${{ needs.wechat-backend.result }}"
