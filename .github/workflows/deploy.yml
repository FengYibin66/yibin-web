name: Deploy to Production

# 生产发布是人工动作，不随合入 main 自动触发（ADR 20260822120807）。
#
# 理由：本仓库主要代码产出者是 AI，其典型失败不是「写出跑不过测试的代码」（CI 能拦），
# 而是「写出跑得过测试但方向错了的代码」。对这类失败唯一有效的检查点是人看一眼，
# 而「合入即上线」恰好取消了这个检查点存在的时间窗。
#
# 上线：Actions → Deploy to Production → Run workflow（选 main）
# 回滚：同一入口重新跑上一个已知良好的 commit
#
# 若觉得这一步麻烦，正确的解法是补足自动化验收（E2E），不是恢复 push 触发。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ──────────────────────────────────────────────────────────────
      # 1. Check out code
      # ──────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────
      # 2. Setup Node.js
      # ──────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ──────────────────────────────────────────────────────────────
      # 3. Setup pnpm
      # ──────────────────────────────────────────────────────────────
      - name: Setup pnpm
        # 必须与 ci.yml 一致（v4）。版本漂移意味着「CI 验过的构建」
        # 与「生产实际执行的构建」用的不是同一个包管理器。
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      # ──────────────────────────────────────────────────────────────
      # 4. Install dependencies
      # ──────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ──────────────────────────────────────────────────────────────
      # 5. Build Portal (Client + Server)
      # ──────────────────────────────────────────────────────────────
      - name: Build Portal
        run: pnpm --filter @yibin/portal build

      # ──────────────────────────────────────────────────────────────
      # 6. Build Resume
      # ──────────────────────────────────────────────────────────────
      - name: Build Resume
        run: pnpm --filter @yibin/resume build

      # ──────────────────────────────────────────────────────────────
      # 7. Build Auto-Wechat Frontend
      # ──────────────────────────────────────────────────────────────
      - name: Build Auto-Wechat Frontend
        run: cd apps/auto-wechat/frontend && pnpm run build

      # ──────────────────────────────────────────────────────────────
      # 8. Set up Docker Buildx
      # ──────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ──────────────────────────────────────────────────────────────
      # 9. Login to Docker Hub (or Docker Registry)
      # ──────────────────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # If using a private registry, replace with:
        # registry: ${{ secrets.DOCKER_REGISTRY }}
        # username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
        # password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # ──────────────────────────────────────────────────────────────
      # 10. Build and push Docker images
      # ──────────────────────────────────────────────────────────────
      - name: Build and push portal-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.portal-server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yibin-portal-server:latest
            ${{ secrets.DOCKER_USERNAME }}/yibin-portal-server:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/yibin-portal-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/yibin-portal-server:buildcache,mode=max

      - name: Build and push resume
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.resume
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yibin-resume:latest
            ${{ secrets.DOCKER_USERNAME }}/yibin-resume:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/yibin-resume:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/yibin-resume:buildcache,mode=max

      # ──────────────────────────────────────────────────────────────
      # 11. Deploy to CVM via SSH
      # ──────────────────────────────────────────────────────────────
      - name: Deploy to CVM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CVM_IP: ${{ secrets.CVM_IP }}
          CVM_USER: ${{ secrets.CVM_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Create temp SSH key file
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add CVM to known_hosts (skip host key checking or add manually)
          ssh-keyscan -H $CVM_IP >> ~/.ssh/known_hosts 2>/dev/null || true

          # SSH to CVM and pull latest images + restart containers
          ssh -i ~/.ssh/deploy_key $CVM_USER@$CVM_IP bash -s << 'DEPLOY_SCRIPT'
            set -e
            cd /data

            # Update docker-compose.prod.yml (optional: version management)
            # If using git, pull latest:
            # git pull origin main

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Restart services with new images
            docker compose -f docker-compose.prod.yml up -d --no-build

            # Cleanup old images (optional)
            docker image prune -f

            echo "✅ Deployment successful"
          DEPLOY_SCRIPT

          # Cleanup local SSH key
          rm ~/.ssh/deploy_key

      # ──────────────────────────────────────────────────────────────
      # 12. Verify deployment (optional health check)
      # ──────────────────────────────────────────────────────────────
      - name: Health Check
        env:
          CVM_IP: ${{ secrets.CVM_IP }}
        run: |
          set -euo pipefail

          # 每个检查都必须真的成立。原实现每条 curl 都跟着 `|| true`，
          # 于是服务起不来时这一步照样打印「✅ Health checks completed」并成功——
          # 部署验证等于没有。健康检查失败必须让整个 deploy 失败。
          check() {
            local name="$1" url="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 "$url" >/dev/null; then
                echo "✅ $name 健康"
                return 0
              fi
              echo "   $name 未就绪（第 $attempt 次），5s 后重试：$url"
              sleep 5
            done
            echo "❌ $name 健康检查失败：$url" >&2
            return 1
          }

          # 容器启动有冷启动时间，靠上面的重试而非固定 sleep 吸收
          check "Portal" "http://$CVM_IP/health"
          check "Auto-Wechat" "http://$CVM_IP/api/v1/health"

          echo "✅ 全部健康检查通过"

      # ──────────────────────────────────────────────────────────────
      # 13. Notify on success/failure (optional)
      # ──────────────────────────────────────────────────────────────
      - name: Notify deployment status
        if: always()
        # 用 steps 级的 job.status 判断是错的：在步骤运行的那一刻 job 尚未结束，
        # `job.status` 恒为 'success'，于是这一步永远打印「成功」，
        # 连部署失败都会报成功。改用 GitHub 提供的 needs/step 级条件表达式。
        run: |
          if [ "${{ contains(join(steps.*.outcome, ','), 'failure') }}" = "true" ]; then
            echo "❌ 部署失败——有步骤未通过"
            # 可选：发 Slack / 飞书告警
            exit 1
          fi
          echo "✅ 生产部署成功"
