<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    引路小狗 · 侧面站姿（朝 −x）。第二版（UI/UX 评审后）：
    - 耳朵起笔接在头部轮廓上、半折下垂（第一版两只分离的尖三角立耳 + 卷尾被读成第二只猫）
    - 尾巴斜后上方一根粗棒，不再回卷
    - 前后各两条腿（同一组内错开 26 px；侧面四条腿是"这是狗"最省事的信号）
    - 口吻拉长；线宽 7 → 4.5、5 → 3.5，墨色 #2b2b2b → #3a3a3a，与猫 / 气泡描边 / INK 同一支笔
    每个部件一个顶层 <g id>，切层脚本按 id 单独栅格化。枢轴见 lib/lab/domain/corridor/dogParts.mjs。
  -->
  <defs>
    <style>
      .ink { fill: #ffffff; stroke: #3a3a3a; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin { fill: none; stroke: #3a3a3a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #3a3a3a; stroke: none; }
    </style>
  </defs>

  <!-- 后腿（两条，远的那条略靠后、略浅） -->
  <g id="leg-back">
    <path class="ink" d="M 672 612 C 668 668, 670 728, 674 796 C 675 816, 683 826, 706 827 C 728 828, 736 818, 734 800 C 731 740, 730 675, 728 618 Z" opacity="0.72"/>
    <path class="ink" d="M 642 612 C 636 668, 638 728, 643 796 C 644 818, 654 830, 684 831 C 714 832, 724 822, 722 800 C 718 740, 718 675, 716 618 Z"/>
    <path class="ink-thin" d="M 660 812 C 672 806, 696 806, 710 812"/>
  </g>

  <g id="tail">
    <!-- 斜后上方一根粗棒：先粗墨线做描边，再细一档的白线覆盖 -->
    <path d="M 748 500 C 790 470, 826 430, 846 372" fill="none" stroke="#3a3a3a" stroke-width="40" stroke-linecap="round"/>
    <path d="M 748 500 C 790 470, 826 430, 846 372" fill="none" stroke="#ffffff" stroke-width="31" stroke-linecap="round"/>
    <path class="ink-thin" d="M 790 456 C 806 438, 822 416, 834 392"/>
  </g>

  <g id="body">
    <!-- 胸腔高、臀部略低，不是一只蛋 -->
    <path class="ink" d="M 330 560 C 322 466, 420 424, 546 430 C 664 436, 766 480, 772 566 C 778 640, 706 686, 566 688 C 434 690, 338 652, 330 560 Z"/>
    <path class="ink-thin" d="M 400 466 C 470 442, 560 438, 640 456"/>
    <path class="ink-thin" d="M 420 662 C 470 676, 560 680, 640 670"/>
    <path class="ink-thin" d="M 364 598 C 372 610, 372 622, 366 634 M 386 604 C 392 616, 392 628, 388 638"/>
  </g>

  <!-- 前腿（两条） -->
  <g id="leg-front">
    <path class="ink" d="M 396 612 C 392 668, 392 728, 396 796 C 397 816, 405 826, 428 827 C 450 828, 458 818, 456 800 C 453 740, 452 675, 450 618 Z" opacity="0.72"/>
    <path class="ink" d="M 362 612 C 358 668, 358 728, 362 796 C 363 818, 373 830, 403 831 C 433 832, 445 822, 443 800 C 440 740, 439 675, 436 618 Z"/>
    <path class="ink-thin" d="M 380 812 C 392 806, 416 806, 428 812"/>
  </g>

  <g id="head">
    <!-- 头：略扁，颈部接身体 -->
    <path class="ink" d="M 304 330 C 376 326, 424 380, 418 448 C 412 516, 362 552, 298 550 C 234 548, 190 500, 194 440 C 198 380, 240 334, 304 330 Z"/>
    <!-- 半折下垂的耳朵：起笔在头顶轮廓上 -->
    <path class="ink" d="M 262 340 C 236 356, 222 396, 232 432 C 246 436, 264 420, 276 398 C 284 378, 282 356, 262 340 Z"/>
    <path class="ink" d="M 360 336 C 388 348, 404 388, 396 424 C 382 430, 366 416, 352 396 C 342 376, 342 352, 360 336 Z"/>
    <!-- 拉长的口吻 -->
    <path class="ink" d="M 216 448 C 160 446, 130 480, 154 510 C 182 536, 246 520, 250 486 C 252 466, 238 450, 216 448 Z"/>
    <circle class="dot" cx="148" cy="484" r="9"/>
    <path class="ink-thin" d="M 168 520 Q 194 538, 226 526"/>
    <!-- 眼睛与眉 -->
    <circle class="dot" cx="280" cy="428" r="9"/>
    <path class="ink-thin" d="M 302 374 C 314 366, 328 368, 336 378"/>
  </g>
</svg>
