user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Docker embedded DNS — defer upstream resolve to request time
    resolver 127.0.0.11 ipv6=off valid=10s;

    # WebSocket proxy (Partner /api/ws)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Partner remote API — literal IP in upstream (no DNS); sync with PARTNER_API_HOST in .env.production
    upstream partner_remote {
        server 212.56.40.104:8080;
    }

    # Certbot single cert (DEPLOYMENT.md):
    #   certbot ... -d www.yibinfeng.com -d resume.yibinfeng.com -d mpauto.yibinfeng.com -d partner.yibinfeng.com
    # → files live under live/www.yibinfeng.com/ (first -d name), not per-subdomain dirs.

    # ──────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # HTTPS: Portal (www.yibinfeng.com)
    # ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name www.yibinfeng.com yibinfeng.com;

        ssl_certificate /etc/letsencrypt/live/www.yibinfeng.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.yibinfeng.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html/portal;
        index index.html;

        # Portal Frontend (Vite dist/)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Portal API — ^~ prefix whitelist (must precede Partner catch-all below)
        # Covers /api/profile without trailing slash — see apps/portal/server
        location ^~ /api/auth/ {
            set $portal_upstream portal-server:3001;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ^~ /api/profile {
            set $portal_upstream portal-server:3001;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/projects {
            set $portal_upstream portal-server:3001;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/uploads {
            set $portal_upstream portal-server:3001;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/health {
            set $portal_upstream portal-server:3001;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Partner WebSocket — wss://www.yibinfeng.com/api/ws → partner_remote
        location ^~ /api/ws {
            proxy_pass http://partner_remote;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Partner API — miniprogram keeps existing www.yibinfeng.com/api/* URLs (no client change)
        # Phase T until partner.yibinfeng.com WeChat domain approved — docs/specs/partner-api.md
        location /api/ {
            proxy_pass http://partner_remote;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Portal uploads (MVP local volume). MUST use ^~ — see docs/specs/portal-media.md
        # TODO(phase-2): remove when media moves to COS + CDN (media.yibinfeng.com)
        location ^~ /uploads/ {
            set $portal_upstream portal-server:3001;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets cache（Vite 产物是内容哈希命名，可以永久缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA 的入口 HTML 不能被缓存：它引用的哈希资源在下一次构建里会被删掉，
        # 浏览器拿着旧 HTML 去取已经不存在的 chunk，结果是白屏而不是「旧版本」。
        # 原先这里没有任何 HTML 规则，浏览器按启发式规则自行缓存——同一类故障的
        # 潜伏版本（resume 那份是显式 max-age=3600，已在下面那个 server 块里说明）。
        location ~* \.html?$ {
            add_header Cache-Control "no-cache" always;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # HTTPS: Resume (resume.yibinfeng.com)
    # ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name resume.yibinfeng.com;

        ssl_certificate /etc/letsencrypt/live/www.yibinfeng.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.yibinfeng.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html/resume;
        index index.html;

        # Next.js `output: 'export'` + `trailingSlash: true`：每条路由都导出成
        # `<路径>/index.html`，并且导出了 `/404.html`。所以这里**不该有 SPA 兜底**。
        #
        # 原配置是 `try_files $uri $uri/ /index.html`，有两个错：
        #
        # 1. 存在但没有 index.html 的目录 → **403**。`$uri/` 命中了目录，nginx 转而
        #    应用 `index index.html`，找不到，autoindex 又是关的，于是吐一个裸的
        #    nginx 403，永远走不到后面的兜底。实测 `/classic/experience/` 与
        #    `/classic/publications/` 都是 403——它们看起来像正常的导航地址，
        #    访客和爬虫都会撞上。
        # 2. 不存在的路径 → **200 + 首页**。软 404：对 SEO 是有害的（搜索引擎会把
        #    大量 URL 当成重复的首页收录），对访客是困惑的（点错链接看到首页，
        #    以为跳转成功了）。
        #
        # 现在：`=404` 让不存在的路径真的 404，`error_page` 再把它换成导出的 404 页；
        # `$uri/` 保留，因为 nginx 靠它做「无斜杠 → 带斜杠」的 301（trailingSlash
        # 需要这个重定向，删掉 `$uri/` 会让 `/lab` 直接 404）。
        #
        # 403 一并映射成 404 是刻意的：对一个纯静态公开站点，「目录存在但没有页面」
        # 语义上就是没有这个页面；顺带也不再对外暴露哪些目录存在。
        error_page 403 404 =404 /404.html;

        # Resume Frontend (Next.js SSG out/)
        location / {
            try_files $uri $uri/ =404;
        }

        # 静态资源：Next 的 /_next/static/** 是内容哈希命名，可以永久缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 必须每次回源校验，不能带 max-age。
        #
        # 原配置是 `add_header Cache-Control "public, max-age=3600"`，而它上面的注释
        # 写着 "Disable caching for HTML files"——**注释与指令相反**，这就是它一直
        # 没被发现的原因。
        #
        # 后果不是「页面旧一小时」这么温和。Next 的客户端路由在 `output: export` 下
        # 取 `<路由>/index.txt` 作为 RSC 数据，并**比对构建 ID**
        # （next/dist/client/components/router-reducer/fetch-server-response.js）：
        #
        #     if (getAppBuildId() !== response.b) return doMpaNavigation(res.url)
        #
        # `res.url` 就是它刚请求的那个 `.txt` 地址。于是「浏览器里的 HTML 是旧构建 +
        # 取到的 payload 是新构建」这个组合，会把用户整页跳转到一个**裸的 RSC 数据
        # 文件**上——满屏 `1:"$Sreact.fragment"`。2026-09-09 上线后点 View details
        # 就是这么撞上的，而且看起来完全不像缓存问题。
        #
        # HTML 缓存一小时意味着**每次部署后的一小时内，所有回访者都会中**。改成
        # no-cache 后残余风险只剩「部署跨越了一个一直开着的标签页」，刷新即恢复。
        #
        # no-cache 不等于不缓存：浏览器仍然存，但每次带 If-None-Match 回来校验，
        # 命中就是 304（几百字节），代价很小。
        location ~* \.html?$ {
            add_header Cache-Control "no-cache" always;
        }

        # RSC payload 与 HTML 必须来自同一次构建，所以同样不能带 max-age。
        # 缓存住它会造成反向的不一致：HTML 是新的、payload 是旧的，同样触发上面那条跳转。
        location ~ /index\.txt$ {
            add_header Cache-Control "no-cache" always;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # HTTPS: Auto-Wechat (mpauto.yibinfeng.com)
    # ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name mpauto.yibinfeng.com;

        ssl_certificate /etc/letsencrypt/live/www.yibinfeng.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.yibinfeng.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html/wechat;
        index index.html;

        # Auto-Wechat Frontend (Vue dist/)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Auto-Wechat Backend API
        location /api/ {
            set $wechat_upstream auto-wechat-api:8080;
            proxy_pass http://$wechat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for long-polling or streaming
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Static assets cache（Vite 产物是内容哈希命名，可以永久缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA 入口 HTML 不缓存，理由同 portal 那个 server 块
        location ~* \.html?$ {
            add_header Cache-Control "no-cache" always;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # HTTPS: Partner API (partner.yibinfeng.com)
    # ──────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name partner.yibinfeng.com;

        ssl_certificate /etc/letsencrypt/live/www.yibinfeng.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.yibinfeng.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://partner_remote;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ──────────────────────────────────────────────────────────────
    # HTTP/2 Push (optional, for performance)
    # ──────────────────────────────────────────────────────────────
    # Uncomment if needed for critical assets

    # include /etc/nginx/conf.d/*.conf;
}
